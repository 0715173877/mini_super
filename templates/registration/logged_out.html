{% extends 'base.html' %}

{% block title %}Logged Out - MiniSuper{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0">
                    <i class="fas fa-check-circle"></i> Successfully Logged Out
                </h4>
            </div>
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="fas fa-sign-out-alt fa-4x text-success mb-3"></i>
                    <h3>You have been logged out</h3>
                    <p class="text-muted">Thank you for using MiniSuper Manager.</p>
                </div>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> Sign In Again
                    </a>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                        <i class="fas fa-home"></i> Return to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
